const FONT = '"Be Vietnam Pro", "Segoe UI", system-ui, sans-serif';
const S = {
  root:{size:17, weight:700, maxW:210, lh:23, px:18, py:14},
  br:{size:14, weight:600, maxW:180, lh:19, px:12, py:9},
  leaf:{size:13, weight:400, maxW:250, lh:18}
};
const ctx = document.createElement("canvas").getContext("2d");
function wrap(text, st){
  ctx.font = `${st.weight} ${st.size}px ${FONT}`;
  const words = text.split(" "); const lines = []; let cur = "";
  for (const w of words){
    const t = cur ? cur + " " + w : w;
    if (ctx.measureText(t).width > st.maxW && cur){ lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  const width = Math.max(...lines.map(l => ctx.measureText(l).width));
  return {lines, width};
}
const NS = "http://www.w3.org/2000/svg";
function el(name, attrs, parent){
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function textBlock(parent, lines, x, yTop, st, anchor, fill){
  const t = el("text", {x, "font-size":st.size, "font-weight":st.weight, "text-anchor":anchor, fill, "font-family":FONT}, parent);
  lines.forEach((l, k) => {
    const sp = el("tspan", {x, y: yTop + st.size + k*st.lh - (st.lh - st.size)/2 + 1}, t);
    sp.textContent = l;
  });
  return t;
}

let natural = {w:0, h:0};
function render(map){
  const svg = el("svg", {xmlns:NS, role:"img", "aria-label":"Sơ đồ tư duy: " + map.root});
  const gEdges = el("g", {fill:"none", "stroke-linecap":"round"}, svg);
  const gNodes = el("g", {}, svg);
  const b = {minX:Infinity, maxX:-Infinity, minY:Infinity, maxY:-Infinity};
  const grow = (x1,y1,x2,y2) => { b.minX=Math.min(b.minX,x1,x2); b.maxX=Math.max(b.maxX,x1,x2); b.minY=Math.min(b.minY,y1,y2); b.maxY=Math.max(b.maxY,y1,y2); };

  const r = wrap(map.root, S.root);
  const rw = r.width + S.root.px*2, rh = r.lines.length*S.root.lh + S.root.py*2;

  const n = map.branches.length, half = Math.ceil(n/2);
  const sides = [map.branches.slice(0, half).map((x,k)=>({...x, c:k})), map.branches.slice(half).map((x,k)=>({...x, c:k+half}))];
  const GAP_BLOCK = 30, GAP_LEAF = 8;

  sides.forEach((list, si) => {
    const dir = si === 0 ? 1 : -1;
    const blocks = list.map(br => {
      const bt = wrap(br.t, S.br);
      const bw = bt.width + S.br.px*2, bh = bt.lines.length*S.br.lh + S.br.py*2;
      const leaves = br.i.map(s => { const w = wrap(s, S.leaf); return {...w, h: w.lines.length*S.leaf.lh + 6}; });
      const lh = leaves.reduce((a,l)=>a+l.h,0) + GAP_LEAF*(leaves.length-1);
      return {br, bt, bw, bh, leaves, H: Math.max(bh, lh), lh};
    });
    const total = blocks.reduce((a,x)=>a+x.H,0) + GAP_BLOCK*(blocks.length-1);
    let y = -total/2;
    blocks.forEach(B => {
      const color = `var(--b${B.br.c+1})`;
      const cy = y + B.H/2;
      const near = dir*(rw/2 + 70);
      const far = near + dir*B.bw;
      const bx = Math.min(near, far);
      // root → branch
      const sx = dir*rw/2, sy = 0;
      el("path", {d:`M${sx},${sy} C${sx+dir*45},${sy} ${near-dir*40},${cy} ${near},${cy}`, stroke:color, "stroke-width":3.2}, gEdges);
      el("rect", {x:bx, y:cy-B.bh/2, width:B.bw, height:B.bh, rx:10, fill:color, "fill-opacity":0.13, stroke:color, "stroke-width":1.8}, gNodes);
      textBlock(gNodes, B.bt.lines, bx + B.bw/2, cy - B.bh/2 + S.br.py, S.br, "middle", "var(--ink)");
      grow(bx, cy-B.bh/2, bx+B.bw, cy+B.bh/2);
      // leaves
      let ly = cy - B.lh/2;
      const lx = far + dir*44;
      B.leaves.forEach(L => {
        const underY = ly + L.lines.length*S.leaf.lh + 3;
        el("path", {d:`M${far},${cy} C${far+dir*24},${cy} ${lx-dir*22},${underY} ${lx},${underY}`, stroke:color, "stroke-width":1.6, "stroke-opacity":0.85}, gEdges);
        el("line", {x1:lx, y1:underY, x2:lx+dir*(L.width+4), y2:underY, stroke:color, "stroke-width":1.6, "stroke-opacity":0.85}, gEdges);
        textBlock(gNodes, L.lines, lx + dir*2, ly, S.leaf, dir===1 ? "start" : "end", "var(--ink)");
        grow(lx, ly, lx+dir*(L.width+4), underY);
        ly += L.h + GAP_LEAF;
      });
      y += B.H + GAP_BLOCK;
    });
  });

  el("rect", {x:-rw/2, y:-rh/2, width:rw, height:rh, rx:16, fill:"var(--root)"}, gNodes);
  textBlock(gNodes, r.lines, 0, -rh/2 + S.root.py, S.root, "middle", "var(--root-ink)");
  grow(-rw/2, -rh/2, rw/2, rh/2);

  const pad = 24;
  const vx = b.minX - pad, vy = b.minY - pad, vw = b.maxX - b.minX + pad*2, vh = b.maxY - b.minY + pad*2;
  svg.setAttribute("viewBox", `${vx} ${vy} ${vw} ${vh}`);
  natural = {w: vw, h: vh};
  return svg;
}

const tabs = document.getElementById("tabs");
const wrapEl = document.getElementById("wrap");
const zoomBtn = document.getElementById("zoom");
const zoomHint = document.getElementById("zoomHint");
let zoomed = window.matchMedia("(max-width: 700px)").matches;
let current = 0;

MAPS.forEach((m, k) => {
  const btn = document.createElement("button");
  btn.type = "button"; btn.textContent = m.label;
  btn.addEventListener("click", () => { location.hash = m.id; });
  tabs.appendChild(btn);
});

function applyZoom(){
  const svg = wrapEl.querySelector("svg");
  if (!svg) return;
  if (zoomed){ svg.style.width = natural.w + "px"; svg.style.maxWidth = "none"; }
  else { svg.style.width = "100%"; svg.style.maxWidth = natural.w + "px"; }
  zoomBtn.textContent = zoomed ? "Thu vừa khung" : "Phóng to";
  zoomHint.textContent = zoomed ? "Kéo ngang để xem hết sơ đồ." : "";
}

function show(){
  const id = (location.hash || "").slice(1);
  let k = MAPS.findIndex(m => m.id === id);
  if (k < 0) k = 0;
  current = k;
  const m = MAPS[k];
  [...tabs.children].forEach((b, j) => b.setAttribute("aria-current", j === k ? "true" : "false"));
  tabs.children[k].scrollIntoView({block:"nearest", inline:"nearest"});
  document.getElementById("question").innerHTML = "";
  const q = document.getElementById("question");
  q.append(m.label + ". ");
  const sp = document.createElement("span"); sp.textContent = m.q; q.appendChild(sp);
  wrapEl.innerHTML = "";
  wrapEl.appendChild(render(m));
  wrapEl.scrollLeft = 0;
  applyZoom();
  document.getElementById("prev").disabled = k === 0;
  document.getElementById("next").disabled = k === MAPS.length - 1;
}

zoomBtn.addEventListener("click", () => { zoomed = !zoomed; applyZoom(); });
document.getElementById("prev").addEventListener("click", () => { if (current > 0) location.hash = MAPS[current-1].id; });
document.getElementById("next").addEventListener("click", () => { if (current < MAPS.length-1) location.hash = MAPS[current+1].id; });
window.addEventListener("hashchange", show);

const ready = document.fonts && document.fonts.load
  ? Promise.all([document.fonts.load(`700 17px "Be Vietnam Pro"`), document.fonts.load(`600 14px "Be Vietnam Pro"`), document.fonts.load(`400 13px "Be Vietnam Pro"`)]).catch(()=>{})
  : Promise.resolve();
Promise.race([ready, new Promise(r => setTimeout(r, 2500))]).then(show);
</script>
